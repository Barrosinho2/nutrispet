<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" role="img" aria-label="Comedouro duplo de inox com ração e água">
  <defs>
    <linearGradient id="cm-base" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2557EA"/>
      <stop offset="1" stop-color="#0029A6"/>
    </linearGradient>
    <linearGradient id="cm-steel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
