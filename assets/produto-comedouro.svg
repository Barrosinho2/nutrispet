    <circle cx="198" cy="225" r="8"/><circle cx="212" cy="233" r="7"/><circle cx="158" cy="242" r="7"/>
    <circle cx="176" cy="243" r="8"/><circle cx="194" cy="242" r="7"/><circle cx="170" cy="216" r="7"/>
    <circle cx="188" cy="214" r="7"/><circle cx="204" cy="214" r="6"/><circle cx="154" cy="220" r="6"/>
  </g>
  <g fill="#fff" opacity=".28">
